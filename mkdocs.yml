site_name: Grove
site_description: A lean Python Blossom server for opaque, content-addressed blobs.
site_url: https://trbouma.github.io/grove/
repo_url: https://github.com/trbouma/grove
repo_name: trbouma/grove

docs_dir: website
site_dir: site

theme:
  name: material
  language: en
  logo: assets/images/grove-logo.png
  favicon: assets/images/grove-logo.png
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Understand Grove:
      - How Grove Works: how-grove-works.md
      - Grove and Acorn: acorn-integration.md
      - Protocol Surface: protocol-surface.md
  - Operate Grove:
      - Getting Started: getting-started.md
      - Production Deployment: deployment.md
      - Configuration: configuration.md
  - Security: security.md
  - Project Status: project-status.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Grove is open-source software released under the MIT License.
